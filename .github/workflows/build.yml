name: Build portable launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable Windows x64 app
        run: dotnet publish MoonSweepers.ModDock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/ModDock
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE dist/ModDock/
          Compress-Archive -Path dist/ModDock/* -DestinationPath dist/MoonSweepers-ModDock-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MoonSweepers-ModDock-Windows-x64-unsigned
          path: dist/MoonSweepers-ModDock-Windows-x64.zip
          if-no-files-found: error
